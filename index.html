<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartStore</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000; /* Black background */
      color: #fff;
      text-align: center;
    }
    header {
      background: #b30000; /* Red header */
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      padding: 20px;
    }
    .card {
      background: #111;
      border: 1px solid #b30000;
      border-radius: 10px;
      padding: 15px;
      margin: 15px auto;
      width: 90%;
      max-width: 300px;
    }
    .card h2 {
      margin: 0;
      color: #b30000;
    }
    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #b30000;
      color: white;
      border-radius: 5px;
      text-decoration: none;
    }
    footer {
      background: #222;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    🚀 SmartStore
  </header>

  <div class="container">
    <h1>Welcome to SmartStore</h1>
    <p>Your own app store - Free & Simple</p>

    <div class="card">
      <h2>SmartGram</h2>
      <p>Village Social Media App</p>
      <a href="#" class="btn">Download</a>
    </div>

    <div class="card">
      <h2>Coming Soon</h2>
      <p>More apps will be added here.</p>
    </div>
  </div>

  <footer>
    Made with ❤️ by Daud
  </footer>
</body>
</html>
